[project]
name = "pyqforge"
version = "0.1.0"
description = "Extract questions, figures and linked solutions from question-bank PDFs using Claude Code / Codex subscriptions"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pyqforge = "pyqforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyqforge*"]

[tool.setuptools.package-data]
pyqforge = ["prompts/*.md", "app/web/*.html"]
